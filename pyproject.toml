[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "stdf-rs"
version = "0.1.0"
description = "Fast Rust-backed decoder for STDF (Standard Test Data Format) semiconductor test data"
requires-python = ">=3.8"

[tool.maturin]
manifest-path = "stdf-py/Cargo.toml"
module-name = "_zstdf"
